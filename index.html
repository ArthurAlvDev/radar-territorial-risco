<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar Territorial de Risco — OlacDev</title>
  <style>
    :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #475569; --primary: #0f766e; --border: #cbd5e1; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 780px; margin: 0 auto; padding: 24px 16px 48px; }
    select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
    footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--border); }
    footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Radar Territorial de Risco</h1>
    <p>Consulta offline de áreas de risco e abrigos comunitários mais próximos.</p>
    <select id="risk" aria-label="Filtrar por nível de risco">
      <option value="">Todos os níveis</option>
      <option value="ALTO">ALTO</option>
      <option value="MÉDIO">MÉDIO</option>
      <option value="BAIXO">BAIXO</option>
    </select>
    <section id="out" aria-live="polite"></section>
  </main>
  <footer>Made by <a href="https://olacdev.com/" target="_blank" rel="noopener noreferrer">OlacDev</a></footer>
  <script type="module">
    import { filterZonesByRisk } from './app.js';
    const sel = document.getElementById('risk');
    function render() {
      document.getElementById('out').innerHTML = filterZonesByRisk(sel.value).map((z) => `<div class="card"><h3>${z.name} (${z.risk})</h3><p>Abrigo: ${z.shelter}</p></div>`).join('');
    }
    sel.addEventListener('change', render);
    render();
  </script>
</body>
</html>
